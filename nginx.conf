# Limite do formulário de proposta, por IP de quem acessou. Atrás do proxy do Easypanel o IP
# da conexão é sempre o do proxy; o do visitante vem em X-Real-IP.
limit_req_zone $http_x_real_ip zone=proposta:1m rate=3r/m;

# www -> domínio principal
server {
    listen 80;
    server_name www.axxiscontabilidade.com.br;
    return 301 https://axxiscontabilidade.com.br$request_uri;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirects relativos: atrás do proxy do Easypanel o nginx não sabe o host/protocolo públicos
    absolute_redirect off;

    # http -> https (o proxy do Easypanel informa o protocolo original)
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    # Endereços antigos duplicados -> versão canônica
    location ~ ^/gestor-estrategico/?$ { return 301 /gestor-estrategico-financeiro/; }
    location ~ ^/startups-e-tecnologia/?$ { return 301 /startups-e-tecnologias/; }

    # Endereços do site anterior -> conteúdo equivalente
    location = /conteudo-axxis-2/ { return 301 /conteudo/; }
    location = /conteudo-simulador-pj-vs-clt-para-altos-salarios/ { return 301 /conteudo/; }
    location = /conteudos-axxis-2/ { return 301 /conteudo/; }
    location = /custos-contratos-e-margens-o-novo-cenario-da-construcao-civil-e-da-engenharia/ { return 301 /custos-contratos-e-margens-o-novo-cenario-da-construcao-civil-engenharia/; }
    location = /documentos-axxis-nady/ { return 301 /; }
    location = /e-bef-estrutura-societaria-e-transparencia/ { return 301 /conteudo/; }
    location = /fator-r-no-simples-nacionalanexo-iii-nem-sempre-significa-menor-custo/ { return 301 /conteudo-desvendando-o-fator-r-em-2026-o-guia-para-reduzir-seu-imposto-no-simples-nacional/; }
    location = /form-solicite-sua-proposta/ { return 301 /solicite-sua-proposta/; }
    location = /inicio/ { return 301 /; }
    location = /materia-teste/ { return 301 /; }
    location = /nossas-redes/ { return 301 /; }
    location = /recebido-contabilidade/ { return 301 /; }
    location = /teste/ { return 301 /; }
    location ^~ /category/ { return 301 /conteudo/; }
    location ^~ /author/ { return 301 /conteudo/; }
    location ~ ^/(feed|comments/feed)/?$ { return 301 /conteudo/; }
    location ~ ^/(sitemap_index|post-sitemap|page-sitemap|category-sitemap|author-sitemap|elementor-hf-sitemap)\.xml$ { return 301 /sitemap.xml; }

    # Formulário "Solicite sua Proposta": a página envia para /api/proposta e o nginx repassa
    # ao servidor do site Digital, que grava o lead direto no 4C e avisa o comercial por e-mail
    # (pasta leads/ do repositório axxiscontabilidadedigital). Sem n8n: em 11/11/2026 um robô leu
    # o endereço do webhook na página e gravou leads falsos no CRM.
    #
    # X-Chave-Consultiva prova para o Digital que o pedido veio deste nginx. O valor vem da
    # variável CONSULTIVA_CHAVE do Easypanel (o Dockerfile instala este arquivo como template e o
    # nginx troca a variável na subida); a mesma chave fica no painel do Digital. Este repositório
    # é público: a chave nunca entra aqui.
    #
    # O destino fica numa variável para o DNS ser resolvido na hora do envio: com o nome direto
    # no proxy_pass, uma falha de DNS na subida do container impediria o nginx de iniciar.
    location = /api/proposta {
        limit_except POST { deny all; }
        limit_req zone=proposta burst=2 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;

        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        resolver_timeout 5s;
        set $destino_proposta "https://axxiscontabilidadedigital.com.br/api/proposta";
        proxy_pass $destino_proposta;
        proxy_ssl_server_name on;
        proxy_set_header Host axxiscontabilidadedigital.com.br;
        proxy_set_header X-Chave-Consultiva "${CONSULTIVA_CHAVE}";
        proxy_set_header X-Cliente-IP $http_x_real_ip;
        proxy_set_header Cookie "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # /pagina -> /pagina/ (URLs sempre com barra no final)
    location / {
        try_files $uri $uri/ =404;
    }

    # CSS e JS: o navegador sempre confere se mudou (resposta 304 rápida quando não mudou)
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache";
    }

    # Imagens, fontes e vídeo: 30 dias
    location ~* \.(png|jpe?g|gif|webp|svg|ico|woff2?|ttf|mp4)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    error_page 404 /404.html;
}
