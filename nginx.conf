# www -> domínio principal
server {
    listen 80;
    server_name www.axxiscontabilidade.com.br;
    return 301 https://axxiscontabilidade.com.br$request_uri;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirects relativos: atrás do proxy do Easypanel o nginx não sabe o host/protocolo públicos
    absolute_redirect off;

    # http -> https (o proxy do Easypanel informa o protocolo original)
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    # Endereços antigos duplicados -> versão canônica
    location ~ ^/gestor-estrategico/?$ { return 301 /gestor-estrategico-financeiro/; }
    location ~ ^/startups-e-tecnologia/?$ { return 301 /startups-e-tecnologias/; }

    # Endereços do site anterior -> conteúdo equivalente
    location = /conteudo-axxis-2/ { return 301 /conteudo/; }
    location = /conteudos-axxis-2/ { return 301 /conteudo/; }
    location = /custos-contratos-e-margens-o-novo-cenario-da-construcao-civil-e-da-engenharia/ { return 301 /custos-contratos-e-margens-o-novo-cenario-da-construcao-civil-engenharia/; }
    location = /documentos-axxis-nady/ { return 301 /; }
    location = /e-bef-estrutura-societaria-e-transparencia/ { return 301 /conteudo/; }
    location = /fator-r-no-simples-nacionalanexo-iii-nem-sempre-significa-menor-custo/ { return 301 /conteudo-desvendando-o-fator-r-em-2026-o-guia-para-reduzir-seu-imposto-no-simples-nacional/; }
    location = /form-solicite-sua-proposta/ { return 301 /; }
    location = /inicio/ { return 301 /; }
    location = /materia-teste/ { return 301 /; }
    location = /nossas-redes/ { return 301 /; }
    location = /recebido-contabilidade/ { return 301 /; }
    location = /teste/ { return 301 /; }
    location ^~ /category/ { return 301 /conteudo/; }
    location ^~ /author/ { return 301 /conteudo/; }
    location ~ ^/(feed|comments/feed)/?$ { return 301 /conteudo/; }
    location ~ ^/(sitemap_index|post-sitemap|page-sitemap|category-sitemap|author-sitemap|elementor-hf-sitemap)\.xml$ { return 301 /sitemap.xml; }

    # /pagina -> /pagina/ (URLs sempre com barra no final)
    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|png|jpe?g|gif|webp|svg|ico|woff2?|ttf|mp4)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    error_page 404 /404.html;
}
