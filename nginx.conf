# www -> domínio principal
server {
    listen 80;
    server_name www.axxiscontabilidade.com.br;
    return 301 https://axxiscontabilidade.com.br$request_uri;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirects relativos: atrás do proxy do Easypanel o nginx não sabe o host/protocolo públicos
    absolute_redirect off;

    # http -> https (o proxy do Easypanel informa o protocolo original)
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    # Endereços antigos duplicados -> versão canônica
    location ~ ^/gestor-estrategico/?$ { return 301 /gestor-estrategico-financeiro/; }
    location ~ ^/startups-e-tecnologia/?$ { return 301 /startups-e-tecnologias/; }

    # Endereços do site anterior e conteúdos removidos -> página equivalente
